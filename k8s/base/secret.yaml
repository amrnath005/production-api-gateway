apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: production-api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
type: Opaque
stringData:
  API_KEY: replace-with-production-api-key
  JWT_SECRET: replace-with-production-jwt-secret
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_TTL_MINUTES: "60"
  DATABASE_URL: postgresql+asyncpg://gateway:gateway_password@postgres:5432/api_gateway
  POSTGRES_DB: api_gateway
  POSTGRES_USER: gateway
  POSTGRES_PASSWORD: gateway_password
