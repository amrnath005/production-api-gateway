apiVersion: batch/v1
kind: Job
metadata:
  name: api-gateway-migrations
  namespace: production-api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: ghcr.io/your-org/api-gateway:latest
          imagePullPolicy: IfNotPresent
          command:
            - alembic
          args:
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
