name: API Gateway CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - observability-platform
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  PYTHONPATH: .

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d api_gateway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_KEY: ci-api-key
      JWT_SECRET: ci-jwt-secret
      DATABASE_URL: postgresql+asyncpg://gateway:gateway_password@localhost:5432/api_gateway
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile application
        run: python -m compileall app tests

      - name: Run migrations
        run: alembic upgrade head
        env:
          PYTHONPATH: .

      - name: Run tests
        run: pytest
        env:
          PYTHONPATH: .

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt || true

  build:
    name: Build, push, and scan images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: Dockerfile
          - image: api-gateway-user-service
            dockerfile: backend_service/Dockerfile
          - image: api-gateway-order-service
            dockerfile: order_service/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Repository Owner Output
        id: prep
        run: |
          echo "image_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_owner }}/${{ matrix.image }}:latest

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_owner }}/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_K8S_DEPLOY == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Repository Owner Output
        id: prep
        run: |
          echo "image_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy manifests
        run: |
          kubectl kustomize k8s/base \
            | sed "s|ghcr.io/your-org/api-gateway:latest|${{ env.REGISTRY }}/${{ steps.prep.outputs.image_owner }}/api-gateway:${{ github.sha }}|g" \
            | sed "s|ghcr.io/your-org/api-gateway-user-service:latest|${{ env.REGISTRY }}/${{ steps.prep.outputs.image_owner }}/api-gateway-user-service:${{ github.sha }}|g" \
            | sed "s|ghcr.io/your-org/api-gateway-order-service:latest|${{ env.REGISTRY }}/${{ env.REGISTRY }}/${{ steps.prep.outputs.image_owner }}/api-gateway-order-service:${{ github.sha }}|g" \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n production-api-gateway rollout status deployment/api-gateway --timeout=180s
          kubectl -n production-api-gateway rollout status deployment/user-service --timeout=180s
          kubectl -n production-api-gateway rollout status deployment/order-service --timeout=180s
